name: Build and Deploy Hugo

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'assets/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - 'hugo.yaml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to external Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: ${{ vars.PAGES_BRANCH || 'main' }}
          publish_dir: ./public
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy from ${{ github.repository }}@${{ github.sha }}"